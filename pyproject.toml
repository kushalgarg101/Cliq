[project]
name = "parcelpilot-support"
version = "0.1.0"
description = "Evidence-first support and operations agent for ParcelPilot"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.2",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "openai>=1.0",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "python-dotenv>=1.2",
  "python-multipart>=0.0.20",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
line-length = 100
extend-exclude = [".uv-cache", ".venv", "data", "var"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
