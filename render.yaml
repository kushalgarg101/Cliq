services:
  - type: web
    name: parcelpilot-support-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: demo
      - key: APP_COOKIE_SECURE
        value: true
      - key: LLM_MODE
        value: auto
      # Set these in Render's Environment dashboard before the demo if using a provider.
      # Values are deliberately never committed.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
